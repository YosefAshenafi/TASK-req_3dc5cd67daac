# docker-compose.prod.yml — production overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides only what differs from the base docker-compose.yml for
# a production deployment:
#   - APP_ENV=production, APP_DEBUG=false, opcache tuned for production.
#   - Horizon restarts automatically if it crashes (inherits restart: unless-stopped
#     from the base service; the supervisor-style command keeps it in the foreground).
#   - A backup service that runs a daily mysqldump and rotates files older than 14 days.
#   - The frontend-dev hot-reload service is excluded (it is in the "dev" profile only).
#
# Before first run:
#   1. Build the frontend:
#        docker compose --profile test run --rm frontend-build
#   2. Set production env vars in .env or pass them via the environment:
#        APP_ENV=production  APP_DEBUG=false  APP_KEY=<your-key>
#        MYSQL_PASSWORD=<strong-password>  MYSQL_ROOT_PASSWORD=<strong-root-password>
#        GATEWAY_TOKEN=<strong-token>

services:

  backend:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    # Opcache pre-loads the entire Laravel bootstrap on startup.
    # PHP_OPCACHE_* vars are picked up by php.ini-production (copy to /etc/php8/conf.d/opcache.ini).
    # We pass them so the entrypoint or a custom php.ini can read them.
    command:
      - sh
      - -c
      - |
        # Write opcache settings at startup so no image rebuild is needed on tuning changes.
        cat > /usr/local/etc/php/conf.d/opcache-prod.ini <<'INI'
        opcache.enable=1
        opcache.memory_consumption=192
        opcache.interned_strings_buffer=16
        opcache.max_accelerated_files=10000
        opcache.validate_timestamps=0
        opcache.save_comments=1
        opcache.enable_cli=0
        INI
        exec /usr/local/bin/entrypoint.sh php-fpm

  queue-worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    # Horizon exits with non-zero on signal; restart:unless-stopped (from base) handles recovery.
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped

  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  # ── Daily backup service ─────────────────────────────────────────────────────
  # Dumps the smartpark database to /var/backups/smartpark/<timestamp>.sql.gz
  # and deletes files older than 14 days.
  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartpark_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - smartpark-backups:/var/backups/smartpark
    networks: [smartpark-lan]
    # Run every 24 hours: sleep → dump → prune → repeat.
    command:
      - sh
      - -c
      - |
        set -e
        while true; do
          STAMP="$$(date +%Y%m%d_%H%M%S)"
          DEST="/var/backups/smartpark/$${STAMP}.sql.gz"
          echo "[backup] Starting dump → $${DEST}"
          mysqldump \
            -h mysql \
            -u root \
            -p"$${MYSQL_ROOT_PASSWORD}" \
            --single-transaction \
            --routines \
            --triggers \
            --hex-blob \
            smartpark | gzip -9 > "$${DEST}"
          echo "[backup] Dump complete ($$(du -sh "$${DEST}" | cut -f1))"
          # Prune backups older than 14 days
          find /var/backups/smartpark -name '*.sql.gz' -mtime +14 -delete
          echo "[backup] Old backups pruned. Sleeping 24 h."
          sleep 86400
        done

volumes:
  smartpark-backups:
