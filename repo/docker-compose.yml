version: "3.9"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smartpark
      MYSQL_USER: smartpark
      MYSQL_PASSWORD: smartpark
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "smartpark", "-psmartpark"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartpark
      DB_USERNAME: smartpark
      DB_PASSWORD: smartpark
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_storage:/var/www/html/storage/app/media
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartpark
      DB_USERNAME: smartpark
      DB_PASSWORD: smartpark
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_storage:/var/www/html/storage/app/media
    networks:
      - app

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["bash", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: smartpark
      DB_USERNAME: smartpark
      DB_PASSWORD: smartpark
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_storage:/var/www/html/storage/app/media
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  db_data:
  media_storage:

networks:
  app:
    driver: bridge
